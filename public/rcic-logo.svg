<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" fill="none" width="100%" height="100%">
  <!-- Minimal Clean Red Maple Leaf -->
  <g transform="translate(0, 6)">
    <path d="M16 2L18.2 8.8H24L19.5 12.5L21.2 19L16 15.2L10.8 19L12.5 12.5L8 8.8H13.8L16 2Z" fill="#C8102E"/>
    <line x1="16" y1="15.2" x2="16" y2="24" stroke="#C8102E" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Typography: Simple, Clean Text-First Design -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- RCIC | CRIC -->
    <text x="34" y="19" font-size="17" font-weight="900" fill="#0F172A" letter-spacing="0.5">RCIC</text>
    <text x="83" y="18" font-size="13" font-weight="300" fill="#94A3B8">|</text>
    <text x="92" y="19" font-size="14" font-weight="700" fill="#475569" letter-spacing="0.5">CRIC</text>

    <!-- Regulated Canadian Immigration Consultant -->
    <text x="34" y="33" font-size="9" font-weight="700" fill="#1E293B" letter-spacing="0.2">
      Regulated Canadian Immigration Consultant
    </text>

    <!-- French Subtitle -->
    <text x="34" y="44" font-size="7.5" font-weight="500" fill="#64748B">
      Consultant réglementé en immigration canadienne
    </text>
  </g>
</svg>